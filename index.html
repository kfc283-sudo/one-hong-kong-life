<style>
  :root {
    --bg: #f6f2ea; --card: #fffdf8; --ink: #23201b; --muted: #6f675b; --line: #e3dccd;
    --accent: #a33b2b; --accent-ink: #fff; --fact: #f0ebdf;
    --health: #3f7f5f; --money: #9a6a12; --people: #3c6a9e; --spirits: #8a4f9e; --help: #e8efe6; --help-ink: #2f5a3f;
    --chart: #1d78a8; --chart-fill: rgba(29,120,168,.12); --grid: #e8e1d3;
    /* Estate wall tiles, taken from the pixel scenes' public-housing blocks. */
    --tile-a: #e8c6a3; --tile-b: #bcd8c3; --tile-c: #efd896; --tile-d: #b7d3e3; --grout: #fffdf8;
    --dusk: #f4e2cf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a17; --card: #24221e; --ink: #ece6da; --muted: #a59d8f; --line: #3a362f;
      --accent: #e0765f; --accent-ink: #1b1a17; --fact: #2c2a25; --help: #23302a; --help-ink: #b9dcc4;
      --health: #6fb08c; --money: #d6a84a; --people: #7fa6d6; --spirits: #c08ad2;
      --chart: #4a8bc9; --chart-fill: rgba(74,139,201,.16); --grid: #34302a;
      --tile-a: #8a6e57; --tile-b: #5f7a68; --tile-c: #8c7b4a; --tile-d: #56707e; --grout: #1b1a17; --dusk: #24232a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a17; --card: #24221e; --ink: #ece6da; --muted: #a59d8f; --line: #3a362f;
    --accent: #e0765f; --accent-ink: #1b1a17; --fact: #2c2a25; --help: #23302a; --help-ink: #b9dcc4;
    --health: #6fb08c; --money: #d6a84a; --people: #7fa6d6; --spirits: #c08ad2;
    --chart: #4a8bc9; --chart-fill: rgba(74,139,201,.16); --grid: #34302a;
    --tile-a: #8a6e57; --tile-b: #5f7a68; --tile-c: #8c7b4a; --tile-d: #56707e; --grout: #1b1a17; --dusk: #24232a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(var(--dusk), var(--bg) 420px) no-repeat, var(--bg); color: var(--ink); font: 17px/1.65 "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  /* The play screen keeps a plain page, so its sticky bar has nothing to clash with. */
  body:has(main[data-screen="play"]) { background: var(--bg); }
  /* A band of estate wall tiles: the one decorative mark, at the top of every screen. */
  body::before { content: ""; display: block; height: 8px;
    background: linear-gradient(90deg, var(--grout) 2px, transparent 2px) 0 0 / 14px 100%,
      repeating-linear-gradient(90deg, var(--tile-a) 0 14px, var(--tile-b) 14px 28px, var(--tile-c) 28px 42px, var(--tile-d) 42px 56px); }
  /* Screens that are one column read best centred. */
  main[data-screen="birth"], main[data-screen="ending"], main[data-screen="methodPage"] { max-width: 740px; }
  main[data-screen="birth"] .narrow, main[data-screen="ending"] .narrow, main[data-screen="methodPage"] .narrow { max-width: none; }
  h1 { font-family: Georgia, "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif; font-size: 2.4rem; line-height: 1.15; margin: 0 0 8px; }
  h2 { font-family: Georgia, "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif; font-size: 1.35rem; margin: 0 0 10px; }
  .kicker { font-size: .9rem; color: var(--muted); }
  .kicker::before { content: ""; display: inline-block; width: 18px; height: 2px; margin-right: 8px; vertical-align: middle; background: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 1px 2px rgba(60,40,20,.05); }
  /* The opening screen arrives in a short, quiet sequence. */
  .hero .heroText > * { animation: rise .6s ease-out both; }
  .hero .heroText > :nth-child(2) { animation-delay: .06s; } .hero .heroText > :nth-child(3) { animation-delay: .12s; }
  .hero .heroText > :nth-child(4) { animation-delay: .18s; } .hero .heroText > :nth-child(n+5) { animation-delay: .26s; }
  .hero-scene { animation: rise .8s .1s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .hero .heroText > *, .hero-scene { animation: none; } }
  .muted { color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 14px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button[aria-pressed="true"] { outline: 2px solid var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; } h1 { font-size: 1.9rem; }
    /* On a phone the year's events come first, right under the button. */
    .grid > .maincol { order: -1; }
    .record { max-height: 48vh; }
    #focus button { padding: 7px 10px; font-size: .92rem; }
  }
  .stat { margin: 8px 0; }
  .stat .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .stat .bar span { display: block; height: 100%; }
  .record { list-style: none; padding: 0; margin: 0; max-height: 62vh; overflow: auto; }
  .record li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .record .age { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; margin-right: 8px; }
  .record .follow { padding-left: 14px; border-left: 3px solid var(--line); }
  .record .death { font-weight: 600; }
  .fact { background: var(--fact); border-radius: 6px; padding: 8px 10px; margin-top: 6px; font-size: .88rem; }
  .fact a { color: var(--muted); }
  .companions li { margin: 6px 0; font-size: .92rem; }
  .ageNum { font-family: Georgia, "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif; font-size: 2.6rem; line-height: 1; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); max-width: 520px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  textarea { width: 100%; min-height: 80px; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .sources li { margin: 4px 0; font-size: .88rem; }
  .sources a { color: var(--ink); }
  .card + .card, .narrow + .card, .card { margin-top: 16px; }
  .grid > div > .card:first-child, .grid > .card { margin-top: 0; }
  .grid { margin-top: 14px; }
  .narrow { max-width: 680px; }
  .lede { font-size: 1.2rem; }
  .small { font-size: .85rem; }
  .hero { padding: 40px 0 10px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  button.link { background: none; border: none; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  button.big { padding: 12px 22px; font-size: 1.05rem; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; max-width: 640px; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin-top: 4px; accent-color: var(--accent); }
  .record .fresh { animation: arrive .5s ease-out backwards; }
  @keyframes arrive { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .record .fresh { animation: appear .2s linear backwards; } }
  .fact .src { display: block; margin-top: 4px; font-size: .8rem; }
  .help { background: var(--help); color: var(--help-ink); border-radius: 6px; padding: 8px 10px; margin-top: 6px; font-size: .88rem; }
  .helpTag { font-weight: 600; }
  .choices { display: grid; gap: 8px; }
  .choices button { text-align: left; }
  ul.plain { padding-left: 18px; margin: 0; }
  ul.plain li { margin: 6px 0; }
  canvas#card { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }
  /* Play bar and pixel scene */
  .playhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .controls button { padding: 7px 11px; font-size: .9rem; }
  .controls .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .controls .seg button { border: none; border-radius: 0; padding: 7px 9px; font-variant-numeric: tabular-nums; }
  .controls .seg button[aria-pressed="true"] { outline: none; background: var(--ink); color: var(--bg); }
  .controls .toggle[aria-pressed="true"] { outline: none; background: var(--fact); border-color: var(--accent); }
  .controls .toggle::before { content: "○ "; }
  .controls .toggle[aria-pressed="true"]::before { content: "● "; color: var(--accent); }
  .scene { margin: 0 0 14px; }
  .maincol .card { margin-top: 0; }
  canvas.pixel { display: block; width: 100%; height: auto; aspect-ratio: 200 / 72; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 10px; border: 1px solid var(--line); background: #dcecea; }
  .sceneCap { margin: 6px 2px 0; font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  .scene.swap canvas.pixel { animation: fadeIn .45s ease-out; }
  @keyframes fadeIn { from { opacity: .35; } to { opacity: 1; } }
  .countdown { margin: 10px 0 4px; }
  .cdbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .cdbar span { display: block; height: 100%; background: var(--accent); }
  /* While playing, a hairline along the bottom of the bar fills toward the next year. */
  /* The closing roll, in the manner of a film's end: one picture and one line at a time. */
  .roll { position: fixed; inset: 0; z-index: 50; background: #1c1915; color: #eee6d8; display: grid; place-items: center; padding: 56px 16px 40px; cursor: pointer; overflow: auto; }
  .rslide { width: min(680px, 100%); text-align: center; }
  .rslide.in { animation: rollIn 1.4s ease-out; }
  @keyframes rollIn { from { opacity: 0; } to { opacity: 1; } }
  .rslide canvas.pixel { filter: sepia(.4) saturate(.8) brightness(.95); border: 0; }
  .rslide .sceneCap { display: none; }
  .rage, .rtitle { font-family: Georgia, "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif; margin: 22px 0 8px; color: #c9b99f; font-size: 1.15rem; }
  .rtitle { font-size: 1.7rem; color: #eee6d8; }
  .rtext { font-size: 1.15rem; line-height: 1.75; margin: 0 auto; max-width: 34em; }
  .rlines { list-style: none; padding: 0; margin: 0; font-size: 1.1rem; line-height: 2; }
  .rskip { position: fixed; top: 14px; right: 16px; background: transparent; color: #d6cab6; border: 1px solid #5c5348; }
  .rhint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: .8rem; color: #8d8273; margin: 0; }
  @media (prefers-reduced-motion: reduce) { .rslide.in { animation: none; } }

  /* Ending: the life again, one row a year, with that year's picture. */
  .years { list-style: none; padding: 0; margin: 8px 0 0; }
  .yrow { display: grid; grid-template-columns: 240px 1fr; grid-template-areas: "pic age" "pic text"; grid-template-rows: auto 1fr; column-gap: 20px; padding: 18px 0; border-top: 1px solid var(--line); align-items: start; }
  .yrow > .yage { grid-area: age; } .yrow > .yscene { grid-area: pic; } .yrow > .record { grid-area: text; }
  .yrow:first-child { border-top: 0; }
  .yscene .sceneCap { font-size: .78rem; }
  .yage { font-size: 1.1rem; margin: 2px 0 4px; }
  .story .record { max-height: none; overflow: visible; }
  .story .record li { padding: 6px 0; border-bottom: 0; }
  details.factd > summary { cursor: pointer; font-size: .8rem; color: var(--muted); margin-top: 4px; width: fit-content; }
  details.factd[open] > summary { margin-bottom: 2px; }
  @media (max-width: 600px) { .yrow { grid-template-columns: 1fr; grid-template-areas: "age" "pic" "text"; row-gap: 6px; padding: 14px 0; } }
  /* Wide screens: a large sticky picture that follows the year in view. */
  @media (min-width: 900px) {
    /* The timeline card steps out of the narrow ending column so the picture can be large. */
    main[data-screen="ending"] .story { --tw: min(1100px, calc(100vw - 48px)); width: var(--tw); margin-left: calc((100% - var(--tw)) / 2); }
  }
  .tl.wide { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .tl.wide .tlpic { position: sticky; top: 16px; }
  .tl.wide .tlpic .scene { margin: 0; }
  .tlage { font-family: Georgia, "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif; font-size: 1.6rem; margin: 6px 2px 0; }
  .tl.wide .yrow { grid-template-columns: 1fr; grid-template-areas: "age" "text"; padding: 14px 0; transition: opacity .3s; }
  .tl.wide .yrow:not(.on) { opacity: .55; }
  .tl.wide .yrow.on .yage { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .tl.wide .yrow { transition: none; } }
  .yearbar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; }
  .yearbar span { display: block; height: 100%; width: 0; background: var(--accent); opacity: .6; }
  dialog .link { margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) { .scene.swap canvas.pixel { animation: none; } }
  @media (max-width: 760px) { .playhead { align-items: flex-start; } .controls button { padding: 6px 9px; font-size: .85rem; } }

  /* Charts */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .who h3 { font-size: .95rem; margin: 14px 0 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; gap: 4px; } }
  table.barlist { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .barlist th { text-align: left; font-weight: 400; padding: 4px 10px 4px 0; white-space: nowrap; }
  .barlist td.bar { width: 55%; padding: 4px 0; }
  .barlist td.bar span { display: block; height: 8px; background: var(--chart); border-radius: 0 4px 4px 0; min-width: 2px; }
  .barlist td.num { text-align: right; padding-left: 10px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
  .src a, p.src a { color: var(--muted); }
  figure.chart { margin: 4px 0 0; }
  svg.survival { width: 100%; height: auto; display: block; touch-action: pan-y; }
  svg.survival:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .survival .grid { stroke: var(--grid); stroke-width: 1; }
  .survival .axis { stroke: var(--muted); stroke-width: 1; }
  .survival .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .survival .area { fill: var(--chart-fill); }
  .survival .curve { fill: none; stroke: var(--chart); stroke-width: 2.5; stroke-linejoin: round; }
  .survival .ref { stroke: var(--muted); stroke-dasharray: 3 3; }
  .survival .note { fill: var(--muted); font-size: 12px; paint-order: stroke; stroke: var(--card); stroke-width: 4px; }
  .survival .me { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .survival .label { fill: var(--ink); font-size: 13px; font-weight: 600; paint-order: stroke; stroke: var(--card); stroke-width: 4px; }
  .survival .cross { stroke: var(--muted); stroke-width: 1; }
  .survival .crossdot { fill: var(--chart); stroke: var(--card); stroke-width: 2; }
  .survival .tip { fill: var(--ink); font-size: 13px; paint-order: stroke; stroke: var(--card); stroke-width: 4px; }
  details.tableview { margin-top: 6px; font-size: .85rem; }
  details.tableview table { border-collapse: collapse; margin-top: 6px; }
  details.tableview td, details.tableview th { padding: 2px 14px 2px 0; text-align: left; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }
  table.calib { border-collapse: collapse; width: 100%; font-size: .88rem; }
  .calib th, .calib td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .calib td { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .calib th[scope=row] { font-weight: 400; }
  .calib .src { display: block; font-size: .75rem; }
  .calib .src a { color: var(--muted); }
  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: center; }
  .hero-scene { margin: 0; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 12px; } .hero-scene { order: -1; } }
  .muted a, p.muted a { color: var(--muted); }
  @media (max-width: 760px) {
    .playhead { gap: 6px; padding: 6px 0; }
    .playhead .ageNum { font-size: 2rem; }
    /* Every control in view, wrapped, with thumb-sized targets; the bar scrolls away on a phone. */
    .playhead { position: relative; }
    .controls { width: 100%; }
    .controls button, .controls .seg button { min-height: 44px; }
    .check input { width: 24px; height: 24px; }
  }
  .controls .hint { flex-basis: 100%; margin: 2px 0 0; }
  h1, h2, h3 { text-wrap: balance; }
  p, li { text-wrap: pretty; }
  :lang(zh-Hant-HK) { line-break: strict; }
  table.barlist { table-layout: fixed; }
  .barlist th { width: 36%; overflow: hidden; text-overflow: ellipsis; }
  .barlist td.num { width: 16%; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) canvas.pixel { filter: brightness(.85); } }
  :root[data-theme="dark"] canvas.pixel { filter: brightness(.85); }
  .hero-scene .sceneCap { display: none; }
  .today { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); max-width: 520px; }
  .today .kicker { margin: 0 0 6px; }
  .tpair { display: flex; gap: 28px; flex-wrap: wrap; }
  .tpair > div { display: flex; flex-direction: column; }
  .tnum { font-family: Georgia, "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tnext { margin-top: 10px; }
  .tnext .cdbar { margin-top: 4px; max-width: 260px; }
  .today p { margin: 8px 0 0; }
  /* ?capture: the life only, for screenshots. */
  .capture #controls, .capture #yearbar, .capture .topbar, .capture footer#foot { display: none; }
  .capture .playhead { position: static; }
  .capture .side { display: none; }
  .capture .grid { grid-template-columns: 1fr; }
  .capture .maincol .card > h2 { display: none; }
  .capture .maincol .card { padding: 6px 14px; }
  .capture .record { max-height: none; }
  .capture main { padding-top: 6px; }
  .capture .scene { margin-bottom: 8px; }
  footer#foot { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
  footer#foot .link { font-size: .8rem; }
  .credit h3 { font-size: 1rem; margin: 14px 0 4px; }
  .credit p { margin: 0; }
</style>
</head>
